services:
  db:
    image: postgres:17
    container_name: tasktracker-db

    env_file:
      - ./config/.env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USER} -d ${DB_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tasktracker-web

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./config/.env

    ports:
      - "8000:8000"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data: