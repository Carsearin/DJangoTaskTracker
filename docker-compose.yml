services:
  db:
    image: postgres:17
    container_name: tasktracker-db

    env_file:
      - ./config/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tasktracker-web

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./config/.env

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
      "

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('localhost', 8000), 2); s.close()\""
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: tasktracker-nginx

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "8000:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: